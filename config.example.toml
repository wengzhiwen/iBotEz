# iBotEz configuration. Copy this file to `config.toml` and edit.

[poll]
# Seconds between chat.db polls. Starts at `interval_seconds`; each empty poll
# multiplies it by `backoff_factor` up to `max_interval_seconds`, then resets to
# `interval_seconds` as soon as a new message arrives.
interval_seconds = 2.0
max_interval_seconds = 15.0
backoff_factor = 1.5

[imessage]
db_path = "~/Library/Messages/chat.db"

[pi]
# How iBotEz launches Pi in RPC mode. The provider/model are left to Pi's own
# settings (configure with `pi config`), so normally you only need the command.
command = ["pi", "--mode", "rpc"]
# cwd = "."
# Slow-turn handling:
progress_interval_seconds = 30      # send a progress iMessage every this long while Pi works (0 = off)
no_progress_timeout_seconds = 120   # no Pi event for this long => stalled => abort + retry
max_retries = 2                     # bounded retries on stall/failure
append_instruction = true           # tell Pi this bot is text-only (it refuses file generate/send requests)
# Auto /compact a scheduled task's Pi session before its prompt once the
# session file exceeds this size (KB). Keeps daily-report sessions from growing
# unboundedly. 0 disables. Interactive sessions are never auto-compacted.
auto_compact_threshold_kb = 400

[scheduler]
# When a scheduled task fails (e.g. a transient provider/network error), retry
# it after each of these delays (minutes). An empty list disables intraday
# retries — the failure notice is sent immediately instead.
retry_minutes = [5, 15, 30]
# On startup, re-run a scheduled task whose most recent due time within this
# many hours was missed (Mac asleep / bridge down) and never completed. A task
# that already succeeded or gave up since that due time is not re-run.
# 0 disables catch-up entirely.
catchup_hours = 24

[bridge]
# Whitelist of senders (phone numbers or emails) whose messages get bridged.
# Phone numbers are matched on their last 10 digits; emails are lowercased.
# Easiest way to populate this: run `python -m ibotez chats`.
allow = []
# Fallback reply when Pi fails to produce an answer. Empty ("") = send nothing.
reply_on_error = "（处理出错了，请稍后再试）"

# Scheduled tasks: run a Pi prompt on a cron schedule and send the result to a
# contact. Repeat [[schedule]] for multiple tasks. `to` is a phone/email with an
# existing iMessage conversation. Cron is 5 fields: minute hour day month weekday
# (0=Sunday); supports *, */N, N, N-M, N,M.
#
# [[schedule]]
# name = "morning-forex"
# cron = "0 9 * * *"                       # every day at 09:00
# prompt = "请简洁总结今日美元兑日元汇率的重要新闻"
# to = "+8613xxxxxxxx"
#
# Built-in tasks: set `builtin` instead of `prompt` to run a maintenance task.
# Available builtins:
#   "pi-update" — run `pi update`, iMessage a briefing to `to`, and when an
#   upgrade lands, restart iBotEz (exit non-zero once idle, supervisor
#   relaunches) so it picks up the new Pi version.
#
# [[schedule]]
# name = "pi-auto-update"
# cron = "23 4 */2 * *"                    # every two days (~48h) at 04:23
# builtin = "pi-update"
# to = "+8613xxxxxxxx"

[health]
# The watchdog checks every `check_seconds`. It restarts iBotEz (by exiting
# non-zero so the supervisor relaunches) when: the Pi subprocess dies, or the
# queue is non-empty with no worker progress for `stall_seconds`.
check_seconds = 5
stall_seconds = 600
max_depth = 100   # queue depth at which a warning is logged

[log]
# Logging. `file` empty => <project>/logs/ibotez.log. `level`: DEBUG/INFO/WARNING/ERROR.
# `-v` on the CLI forces DEBUG regardless of `level`.
file = ""
level = "INFO"
