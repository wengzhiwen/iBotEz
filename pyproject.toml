[project]
name = "ibotez"
version = "0.1.0"
description = "Minimal iMessage <-> Pi (pi.dev) message bridge for macOS"
readme = "README.md"
requires-python = ">=3.11"
# No runtime dependencies — Python standard library only.

[project.scripts]
ibotez = "ibotez.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ibotez"]
